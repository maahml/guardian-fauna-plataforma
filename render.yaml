services:
  - type: web
    name: guardian-fauna-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: API_BASE_URL
        value: https://gcyber.com.br/api/v1
